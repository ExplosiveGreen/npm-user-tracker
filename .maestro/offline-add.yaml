appId: host.exp.exponent
name: offline-add-shows-retry
---
# Run while the device network is disabled (done from scripts/e2e.mjs). The
# flow only focuses the field — the harness types the name via adb key events
# next (Maestro's inputText bypasses React Native's onChange), then
# offline-add-add.yaml taps Add. The failure surfaces after the harness
# force-runs the background task (offline-add-result.yaml). Starts from a
# clean Expo Go state (empty DB).
- launchApp:
    clearState: true
- openLink: exp://127.0.0.1:8081
# Dismiss Expo Go's first-launch dev-menu onboarding if it appears, then close
# the dev menu sheet that follows it so the app content is reachable.
- tapOn:
    text: "Continue"
    optional: true
- runFlow:
    when:
      visible: "Go home"
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: "username-input"
    timeout: 120000

- tapOn:
    id: "username-input"