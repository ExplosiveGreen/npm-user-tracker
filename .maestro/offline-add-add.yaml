appId: host.exp.exponent
name: offline-add-queues-job
---
# Runs after the harness typed the username via adb (field is focused from
# offline-add.yaml). The job queues instead of failing — execution lives in
# the background task, which the harness force-runs next while still offline.
- tapOn:
    id: "add-user"
- extendedWaitUntil:
    visible: "Queued: scanning instafluff…"
    timeout: 20000
