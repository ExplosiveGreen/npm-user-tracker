appId: host.exp.exponent
name: username-suggestions
---
# Typing a username prefix shows up to 5 real-maintainer suggestions from the
# bundled list; tapping one only fills the input (suggestions are never
# auto-tracked), and "Add user" then tracks it.
- launchApp:
    clearState: true
- openLink: exp://127.0.0.1:8081
# Dismiss Expo Go's first-launch dev-menu onboarding if it appears, then close
# the dev menu sheet that follows it so the app content is reachable.
- tapOn:
    text: "Continue"
    optional: true
- runFlow:
    when:
      visible: "Go home"
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: "username-input"
    timeout: 120000

# Typing a prefix surfaces the suggestion dropdown with the real username.
# Typing is split out: Maestro's inputText bypasses React Native's onChange
# (no suggestions would appear), so after this flow focuses the field, type
# the prefix via `adb shell input text t3dot`, then run
# username-suggestions-add.yaml.
- tapOn:
    id: "username-input"
