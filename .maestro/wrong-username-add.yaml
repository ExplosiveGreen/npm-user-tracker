appId: host.exp.exponent
name: wrong-username-adds-user
---
# Runs after the harness typed the username via adb (field is focused from
# wrong-username.yaml). Tapping Add enqueues the scan — execution lives in the
# OS background task, so a queued row is the expected state here.
- tapOn:
    id: "add-user"
- extendedWaitUntil:
    visible: "Queued: scanning ~t3dotgg…"
    timeout: 20000
