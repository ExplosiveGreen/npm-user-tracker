appId: host.exp.exponent
name: online-retry-queues-job
---
# Run after scripts/e2e.mjs has restored the network following the offline-add
# flow. The app is still on the failed-job screen; tapping retry only requeues
# now (execution lives in the background task), so assert the queued state.
# The harness force-runs the background job next, then online-retry-result
# asserts the populated tables.
- tapOn:
    id: "retry-scan"
- extendedWaitUntil:
    visible: "Queued: scanning instafluff…"
    timeout: 20000