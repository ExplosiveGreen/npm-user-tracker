appId: host.exp.exponent
name: online-retry-queues-job
---
# Run after scripts/e2e.mjs has restored the network following the offline-add
# flow. Tapping retry only requeues (execution lives in the background task).
# The 30s background retry ladder may already have cleared the failure once
# the network returned — so only tap when the retry button is still there.
# Either way the harness force-runs the background job next, then
# online-retry-result asserts the populated tables.
- runFlow:
    when:
      visible:
        id: "retry-scan"
    commands:
      - repeat:
          while:
            notVisible: "Queued: scanning instafluff…"
          times: 5
          commands:
            - tapOn:
                id: "retry-scan"
                optional: true
