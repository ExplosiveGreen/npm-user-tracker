appId: host.exp.exponent
name: theme-toggle-pins-and-releases
---
# Runs with the device OS in LIGHT mode (forced by scripts/e2e.mjs via
# `adb shell cmd uimode night no` before this flow). Starts from a clean Expo Go
# state, so the app has no stored preference and follows the OS. Exercises the
# Lea Verou toggle contract: pin the opposite scheme, then release back to the
# OS when the target coincides with the system again.
- launchApp:
    clearState: true
- openLink: exp://127.0.0.1:8081
# Dismiss Expo Go's first-launch dev-menu onboarding if it appears, then close
# the dev menu sheet that follows it so the app content is reachable.
- tapOn:
    text: "Continue"
    optional: true
- runFlow:
    when:
      visible: "Go home"
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: "username-input"
    timeout: 120000

# Fresh install: no stored override, page follows the light OS, weak theme off.
- assertVisible: "Dark mode"
- assertVisible: "Following system \\(light\\)"
- assertVisible: "^Dark$"
- assertVisible:
    id: "dark-mode-switch"
    enabled: true

# Flip to dark: target (light -> dark) differs from the OS, so it is pinned.
- tapOn:
    id: "dark-mode-switch"
- assertVisible: "Set to dark"
- assertVisible: "^Light$"

# Flip back: target (dark -> light) matches the OS now, so the override is
# released and the page follows the system again.
- tapOn:
    id: "dark-mode-switch"
- assertVisible: "Following system \\(light\\)"
- assertVisible: "^Dark$"