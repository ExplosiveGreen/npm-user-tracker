appId: com.anonymous.npmusertracker
name: theme-toggle-pins-and-releases
---
# Runs with the device OS in LIGHT mode (forced by scripts/e2e.mjs via
# `adb shell cmd uimode night no` before this flow). Starts from a clean
# install, so the app follows the OS (light). The home screen no longer has
# the full dark-mode card (removed in favor of the header toggle), so this
# covers the header button contract: it always labels the scheme a tap would
# switch to, flipping back and forth.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "username-input"
    timeout: 120000

# Following light OS: the button offers dark.
- assertVisible: "^Dark$"

# Tap: pins dark, so the button now offers light.
- tapOn: "Dark"
- assertVisible: "^Light$"

# Tap: releases back to the light OS, offering dark again.
- tapOn: "Light"
- assertVisible: "^Dark$"
