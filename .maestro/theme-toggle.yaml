appId: com.anonymous.npmusertracker
name: theme-toggle-pins-and-releases
---
# Runs with the device OS in LIGHT mode (forced by scripts/e2e.mjs via
# `adb shell cmd uimode night no` before this flow). Starts from a clean
# install, so the app has no stored preference and follows the OS. Exercises the
# Lea Verou toggle contract: pin the opposite scheme, then release back to the
# OS when the target coincides with the system again.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "username-input"
    timeout: 120000

# Fresh install: no stored override, page follows the light OS, weak theme off.
- assertVisible: "Dark mode"
- assertVisible: "Following system \\(light\\)"
- assertVisible: "^Dark$"
- assertVisible:
    id: "dark-mode-switch"
    enabled: true

# Flip to dark: target (light -> dark) differs from the OS, so it is pinned.
- repeat:
    while:
      notVisible: "Set to dark"
    times: 3
    commands:
      - tapOn:
          id: "dark-mode-switch"
      - runFlow:
          when:
            visible: "Go home"
          commands:
            - back
- assertVisible: "Set to dark"
- assertVisible: "^Light$"

# Flip back: target (dark -> light) matches the OS now, so the override is
# released and the page follows the system again.
- repeat:
    while:
      notVisible: "Following system \\(light\\)"
    times: 3
    commands:
      - tapOn:
          id: "dark-mode-switch"
      - runFlow:
          when:
            visible: "Go home"
          commands:
            - back
- assertVisible: "Following system \\(light\\)"
- assertVisible: "^Dark$"