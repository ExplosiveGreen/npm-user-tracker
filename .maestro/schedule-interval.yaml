appId: com.anonymous.npmusertracker
name: schedule-interval-validation-and-apply
---
# Covers the custom scan schedule control: validation rejects sub-minimum
# intervals, valid input persists and is reflected back, and the choice
# survives an app restart (prefs + background re-registration path).
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Scan schedule"
    timeout: 60000
- assertVisible: "Currently: every 1 hour."

# Below the 15-minute OS floor: entering 5 minutes must show the minimum
# error and leave the saved value untouched. NOTE: assertVisible needs the
# full exact string here — this Maestro version does not substring-match.
# Typing is split out: Maestro's inputText bypasses React Native's onChange,
# so after this flow focuses the field, type the digits via
# `adb shell input text 5`, then run schedule-interval-apply.yaml.
- tapOn:
    id: "scan-interval-number"
- eraseText: 10
