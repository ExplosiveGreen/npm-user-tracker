appId: host.exp.exponent
name: wrong-username-deletes-user
---
# Starts from a clean install (empty DB) to mirror the manual clean-slate test.
# Expo Go's data is cleared, then the project is opened from the local Metro
# bundler (adb reverse port 8081) so the app boots with a fresh database.
- launchApp:
    clearState: true
- openLink: exp://127.0.0.1:8081
# Dismiss Expo Go's first-launch dev-menu onboarding if it appears, then close
# the dev menu sheet that follows it so the app content is reachable.
- tapOn:
    text: "Continue"
    optional: true
- runFlow:
    when:
      visible: "Go home"
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: "username-input"
    timeout: 120000

# Enter a username that is not real and queue it. Execution lives in the OS
# background task now — the foreground only enqueues, so a queued row (not an
# outcome) is the expected state here. The harness force-runs the background
# job next, then wrong-username-result.yaml asserts the outcome.
- tapOn:
    id: "username-input"
- inputText: "~t3dotgg"
- tapOn:
    id: "add-user"

- extendedWaitUntil:
    visible: "Queued: scanning ~t3dotgg…"
    timeout: 20000