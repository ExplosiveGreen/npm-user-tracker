appId: host.exp.exponent
name: wrong-username-deletes-user
---
# Starts from a clean install (empty DB) to mirror the manual clean-slate test.
# Expo Go's data is cleared, then the project is opened from the local Metro
# bundler (adb reverse port 8081) so the app boots with a fresh database.
- launchApp:
    clearState: true
- openLink: exp://127.0.0.1:8081
# Dismiss Expo Go's first-launch dev-menu onboarding if it appears, then close
# the dev menu sheet that follows it so the app content is reachable.
- tapOn:
    text: "Continue"
    optional: true
- runFlow:
    when:
      visible: "Go home"
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: "username-input"
    timeout: 120000

# Enter a username that is not real and run the scan.
- tapOn:
    id: "username-input"
- inputText: "~t3dotgg"
- tapOn:
    id: "add-user"

# The registry returns no packages, so the job is flagged with the
# "this user may not exist" prompt. A transient scan error can surface a retry
# button instead; retry the scan until the no-data state is reached.
- repeat:
    while:
      notVisible:
        id: "delete-user-button"
    times: 3
    commands:
      - tapOn:
          id: "retry-scan"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "delete-user-button"
          timeout: 20000
- assertVisible: "No npm packages found for ~t3dotgg."

# Confirm deletion removes the user from the list.
- tapOn:
    id: "delete-user-button"
- assertVisible: "This user might not exist"
- tapOn: "Delete user"
- assertNotVisible: "~t3dotgg"