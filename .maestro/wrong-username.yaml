appId: com.anonymous.npmusertracker
name: wrong-username-deletes-user
---
# Starts from a clean install (empty DB) to mirror the manual clean-slate test.
# Expo Go's data is cleared, then the project is opened from the local Metro
# bundler (adb reverse port 8081) so the app boots with a fresh database.
# Starts from a clean install (empty DB). Release build boots straight home —
# no Expo Go onboarding to dismiss.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "username-input"
    timeout: 120000

# Enter a username that is not real and queue it. The flow only focuses the
# field — the harness types the name via adb key events and taps Add until
# the queued row appears (Maestro's inputText uses setText, which bypasses
# React Native's onChange so the Add button would silently no-op). Then the
# harness force-runs the background job before wrong-username-result.yaml
# asserts the outcome.
- tapOn:
    id: "username-input"