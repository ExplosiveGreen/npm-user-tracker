appId: com.anonymous.npmusertracker
name: table-delete-removes-row
---
# Run after online-retry.yaml, which leaves a single npm user (instafluff)
# persisted along with its scans and job rows. Deep-link to the npm_users table
# screen and use the Delete button on the row's card; the row must disappear, and
# every row connected to it (scans, jobs) must be deleted too.
- openLink: mynpm://db/npm_users
- extendedWaitUntil:
    visible: "username : instafluff"
    timeout: 15000

- tapOn:
    id: "delete-row"
- assertVisible: "Delete row"
- tapOn: "Delete"
- assertNotVisible: "username : instafluff"

# The npm_users row is gone. Cascade deletion must have removed the scans and
# jobs that referenced it, so both tables must now be empty.
- openLink: mynpm://db/scans
- extendedWaitUntil:
    notVisible: "#1"
    timeout: 15000
- openLink: mynpm://db/jobs
- extendedWaitUntil:
    notVisible: "#1"
    timeout: 15000