appId: com.anonymous.npmusertracker
name: online-retry-populates-tables-result
---
# Runs after the harness force-ran the OS background task back online: the
# requeued retry has now executed. Bring the app forward and verify the
# success state and that every table received at least one row.
- launchApp:
    clearState: false
# Histories backfill after the job succeeds, so allow time for that. The Done
# label lives on the tracked-author card below the fold — scroll it into view
# (a successful scan shows nothing in "Needs attention" by design).
- scrollUntilVisible:
    element:
      text: "Done: instafluff.*"
    timeout: 300000
- assertVisible: "Done: instafluff.*"

# Npm users show up on the home screen once persisted (below the fold —
# scroll it into view first).
- scrollUntilVisible:
    element:
      text: "username : instafluff"

# Navigate to the DB explorer and confirm each table has data. Deep-linking to
# the route is more reliable than tapping the on-screen link while the home
# layout is still settling after the scan.
- openLink: mynpm://db
- extendedWaitUntil:
    visible: "npm_users"
    timeout: 15000

# Each table rows are rendered as cards numbered from #1, so a visible #1 proves
# the table is not empty without depending on any specific package or count.
# Deep-linking to each table route avoids tapping through the long table list.
- openLink: mynpm://db/npm_users
- extendedWaitUntil:
    visible: "#1"
    timeout: 15000

- openLink: mynpm://db/packages
- extendedWaitUntil:
    visible: "#1"
    timeout: 15000

# package_versions is only written by the version-history backfill, so a row
# here proves release history was fetched from the registry.
- openLink: mynpm://db/package_versions
- extendedWaitUntil:
    visible: "#1"
    timeout: 15000

- openLink: mynpm://db/scans
- extendedWaitUntil:
    visible: "#1"
    timeout: 15000

- openLink: mynpm://db/jobs
- extendedWaitUntil:
    visible: "#1"
    timeout: 15000
