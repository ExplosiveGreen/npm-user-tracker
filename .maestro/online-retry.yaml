appId: host.exp.exponent
name: online-retry-populates-tables
---
# Run after scripts/e2e.mjs has restored the network following the offline-add
# flow. The app is still on the failed-job screen, so retry the same job and
# verify every table received at least one row.
- tapOn:
    id: "retry-scan"
# Success takes a while: every newly-seen package also fetches its full release
# history from the registry during the scan, so allow time for that.
- extendedWaitUntil:
    visible: "Done: instafluff.*"
    timeout: 300000

# Npm users show up on the home screen once persisted.
- assertVisible: "username : instafluff"

# Navigate to the DB explorer and confirm each table has data. Deep-linking to
# the route is more reliable than tapping the on-screen link while the home
# layout is still settling after the scan.
- openLink: exp://127.0.0.1:8081/--/db
- extendedWaitUntil:
    visible: "npm_users"
    timeout: 15000

# Each table rows are rendered as cards numbered from #1, so a visible #1 proves
# the table is not empty without depending on any specific package or count.
# Deep-linking to each table route avoids tapping through the long table list.
- openLink: exp://127.0.0.1:8081/--/db/npm_users
- extendedWaitUntil:
    visible: "#1"
    timeout: 15000

- openLink: exp://127.0.0.1:8081/--/db/packages
- extendedWaitUntil:
    visible: "#1"
    timeout: 15000

# package_versions is only written by the version-sync feature, so a row here
# proves release history was fetched from the registry.
- openLink: exp://127.0.0.1:8081/--/db/package_versions
- extendedWaitUntil:
    visible: "#1"
    timeout: 15000

- openLink: exp://127.0.0.1:8081/--/db/scans
- extendedWaitUntil:
    visible: "#1"
    timeout: 15000

- openLink: exp://127.0.0.1:8081/--/db/jobs
- extendedWaitUntil:
    visible: "#1"
    timeout: 15000