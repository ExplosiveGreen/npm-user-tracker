appId: com.anonymous.npmusertracker
name: offline-add-shows-retry-result
---
# Runs after the harness force-ran the OS background task while still offline:
# the fetch must have failed, so the job errors and offers a retry.
- launchApp:
- extendedWaitUntil:
    visible:
      id: "retry-scan"
    timeout: 60000
- assertVisible: "Scan failed for instafluff.*"
