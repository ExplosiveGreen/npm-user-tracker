appId: com.anonymous.npmusertracker
name: theme-follows-system-and-pins-override
---
# Runs with the device OS in DARK mode (forced by scripts/e2e.mjs via
# `adb shell cmd uimode night yes` before this flow). Fresh install, no
# stored preference, so the page follows the dark OS. Covers the header
# button contract in the other direction.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "username-input"
    timeout: 120000

# Following dark OS: the button offers light.
- assertVisible: "^Light$"

# Tap: pins light, so the button now offers dark.
- tapOn: "Light"
- assertVisible: "^Dark$"

# Tap: releases back to the dark OS, offering light again.
- tapOn: "Dark"
- assertVisible: "^Light$"
